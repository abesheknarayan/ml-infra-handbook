name: Sync ML Infra Live Feed (Every 2 Hours)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl 18 RSS, GitHub Releases & arXiv feeds
        run: node scripts/crawl-to-json.mjs

      - name: Commit updated feed if new items arrived
        run: |
          if git diff --quiet indexed_feed.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "ml-infra-handbook-bot"
          git config user.email "bot@users.noreply.github.com"
          git add indexed_feed.json
          git commit -m "chore: sync live feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
